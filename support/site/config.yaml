# =============================================================================
# support/site/config.yaml (formerly home/webroot.yaml) - Platform-neutral config standard
# Site config lives here. Secrets live in .env
#
# Platform        Files replaced
# --------------  ------------------------------------------
# Netlify         netlify.toml, _redirects, _headers
# Vercel          vercel.json + next.config.js (hosting layer)
# Firebase        firebase.json (hosting section)
# Cloudflare      _headers, _redirects, wrangler.toml (routing)
#
# LOCATION: localsite (localsite.js, cms.js) reads only {webroot}/support/site/config.yaml.
# There's no longer a fallback to /webroot.yaml, home/webroot.yaml or docker/webroot.yaml.


# For upcoming https://github.com/garmartirosy/pipeline
